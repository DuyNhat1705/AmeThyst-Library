, and the 13-genre filter</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6160.52 2883)">Complete the Study Group pages: browse/join study groups, and "Your Study Groups" (created &amp; joined)</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6329.94 2968)">Complete Profile Management and Librarian Authentication (Login, Register, Forgot Password)</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6090.42 3054)">Complete the Book Borrowing flow with Pin Verification, covering both user-facing and librarian-facing pages</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6768.48 3139)">Overview and Merge Code (two integration passes across the sprint)</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6883.11 3225)">Complete the Librarian Announcements page based on Figma</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 7149.38 3310)">Redesign UI based on team meeting feedback</text></g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 7072.15 3395)">Complete the Library Map feature based on Figma</text></g><g><g><text fill="#595959" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="400" font-size="41" transform="matrix(1 0 0 1 6422.22 3481)">Write unit tests (≥10 test cases) for the Register usecase (all relevant modules if possible)</text></g></g><g><text fill="#595959" font-family="C