name: Memgraph Data Sync & Retraining Pipeline

on:
  schedule:
    # Run automatically every day at 02:00 UTC
    - cron: '0 2 */3 * *'
  workflow_dispatch:
    inputs:
      sync_db:
        description: 'Sync PostgreSQL (Supabase) data to Memgraph before retraining'
        type: boolean
        default: false
      run_graphsage:
        description: 'Run GraphSAGE training'
        type: boolean
        default: false
      run_lightgbm:
        description: 'Run LightGBM training'
        type: boolean
        default: false
      export_snapshot:
        description: 'Export Memgraph snapshot artifact'
        type: boolean
        default: false
      deploy_cloud:
        description: 'Deploy retrained graph to Memgraph Cloud'
        type: boolean
        default: true

jobs:
  sync-and-retrain:
    runs-on: ubuntu-latest

    services:
      memgraph:
        image: memgraph/memgraph-mage:latest
        ports:
          - 7687:7687
        env:
          MEMGRAPH_USER: ${{ secrets.MEMGRAPH_USER }}
          MEMGRAPH_PASSWORD: ${{ secrets.MEMGRAPH_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/database/Init_data/requirements.txt

      - name: Wait for Memgraph service connection
        env:
          MEMGRAPH_URI: ${{ secrets.MEMGRAPH_URI }}
          MEMGRAPH_HOST: ${{ secrets.MEMGRAPH_HOST }}
          MEMGRAPH_PORT: ${{ secrets.MEMGRAPH_PORT }}
        run: |
          python -c "
          import os, socket, time, urllib.parse
          uri = os.environ.get('MEMGRAPH_URI') or ''
          if uri:
              parsed = urllib.parse.urlparse(uri.replace('bolt://', 'http://'))
              host = parsed.hostname or 'localhost'
              port = parsed.port or 7687
          else:
              host = os.environ.get('MEMGRAPH_HOST') or 'localhost'
              raw_port = (os.environ.get('MEMGRAPH_PORT') or '').strip()
              port = int(raw_port) if raw_port.isdigit() else 7687
          print(f'Waiting for Memgraph at {host}:{port}...')
          for _ in range(30):
              try:
                  with socket.create_connection((host, port), timeout=2):
                      print('Memgraph is ready!')
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise TimeoutError('Memgraph service timed out.')
          "

      - name: Sync PostgreSQL (Supabase) data to Memgraph
        if: ${{ github.event_name == 'schedule' || inputs.sync_db == true }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MEMGRAPH_URI: ${{ secrets.MEMGRAPH_URI }}
          MEMGRAPH_USER: ${{ secrets.MEMGRAPH_USER }}
          MEMGRAPH_PASSWORD: ${{ secrets.MEMGRAPH_PASSWORD }}
        run: |
          echo "Starting data synchronization from Supabase PostgreSQL to Memgraph..."
          python src/database/Init_data/Init_graph.py

      - name: Retrain GraphSAGE model
        if: ${{ github.event_name == 'schedule' || inputs.run_graphsage == true }}
        env:
          MEMGRAPH_URI: ${{ secrets.MEMGRAPH_URI }}
          MEMGRAPH_USER: ${{ secrets.MEMGRAPH_USER }}
          MEMGRAPH_PASSWORD: ${{ secrets.MEMGRAPH_PASSWORD }}
        run: |
          echo "Triggering GraphSAGE link prediction & embedding retraining..."
          python src/database/Init_data/GraphSAGE.py

      - name: Retrain LightGBM ranker
        if: ${{ github.event_name == 'schedule' || inputs.run_lightgbm == true }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          echo "Training LightGBM model..."
          python src/database/Init_data/LightGBM.py

      - name: Export Memgraph snapshot artifact
        if: ${{ github.event_name == 'schedule' || inputs.export_snapshot == true }}
        env:
          MEMGRAPH_URI: ${{ secrets.MEMGRAPH_URI }}
          MEMGRAPH_USER: ${{ secrets.MEMGRAPH_USER }}
          MEMGRAPH_PASSWORD: ${{ secrets.MEMGRAPH_PASSWORD }}
        run: |
          echo "Attempting snapshot export..."
          CONTAINER_ID=$(docker ps -q -f ancestor=memgraph/memgraph-mage:latest | head -n 1)
          export MEMGRAPH_CONTAINER_NAME="$CONTAINER_ID"
          python src/database/Init_data/Model_snapshot.py export || {
            echo "Fallback: dumping database cypher log..."
            docker exec "$CONTAINER_ID" mgconsole --username "${MEMGRAPH_USER}" --password "${MEMGRAPH_PASSWORD}" --output-format=cypherl -c "DUMP DATABASE;" > src/database/Init_data/datagraph_backup.cypher || true
          }

      - name: Upload Memgraph Trained Artifacts
        if: ${{ github.event_name == 'schedule' || inputs.export_snapshot == true }}
        uses: actions/upload-artifact@v4
        with:
          name: memgraph-trained-snapshot
          path: |
            src/database/Init_data/amethyst_graph.snapshot
            src/database/Init_data/datagraph_backup.cypher
          retention-days: 14
          if-no-files-found: ignore

      - name: Deploy retrained graph to Memgraph Cloud
        if: ${{ github.event_name == 'schedule' || inputs.deploy_cloud == true }}
        env:
          MEMGRAPH_URI_SERVER: ${{ secrets.MEMGRAPH_URI_SERVER }}
          MEMGRAPH_USER_SERVER: ${{ secrets.MEMGRAPH_USER_SERVER }}
          MEMGRAPH_PASSWORD: ${{ secrets.MEMGRAPH_PASSWORD }}
        run: |
          if [ -n "$MEMGRAPH_URI_SERVER" ]; then
            echo "Deploying retrained database dump to Memgraph Cloud..."
            python src/database/Init_data/Deploy_cloud.py
          else
            echo "MEMGRAPH_URI_SERVER is not set. Skipping deployment."
          fi